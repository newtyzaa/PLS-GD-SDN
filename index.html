/* PIN yang diketik staff akan otomatis login memakai akun Firebase di bawah ini.

const STAFF_ACCOUNT = {

const OWN_WAREHOUSES = ["SDNC.UTM","SDNC.SHO","SDNC.DEM","SDNC.RUS","SDNX.STR"];
const CHUNK_SIZE = 4000; // baris per dokumen Firestore (aman di bawah batas 1MB/dokumen)

let state = {
  items: [], serialNumber: [], stockCabang: [], barcode: [], manualSupport: [],
  itemsUpdated: '', serialUpdated: '', cabangUpdated: '', barcodeUpdated: '', manualSupportUpdated: '',
  itemsIndex: {}, serialIndex: {}, cabangIndex: {}, barcodeIndex: {},
  manualIndex: {}, knownDescSet: new Set(),
  staffMode: false, tab: 'upload', showLogin: false, loginErr: '',
  filters: {brand:[], jenis:[], tipe:[], harga:[], status:[], xs:[]}, filterOpen: false, pending: 0, loadFail: false,
  query: '', loaded: false, dataVer: 0,
  publicView: 'stok', promotorBrand: null,
  leasingHeader: null, leasingRows: [], leasingUpdated: '', leasingErr: '', skemaQuery: '', skemaProvider: null
};

// ---------------- Firestore helpers ----------------
// ---- Cache lokal (IndexedDB) supaya pengakses link tidak perlu download ulang
// data yang belum berubah setiap kali buka halaman. ----
const IDB_NAME = 'stokGudangCache', IDB_STORE = 'cache';
function idbOpen(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = ()=> req.result.createObjectStore(IDB_STORE);
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbGet(key){
  try{
    const idb = await idbOpen();
    return await new Promise((resolve)=>{
      const req = idb.transaction(IDB_STORE,'readonly').objectStore(IDB_STORE).get(key);
      req.onsuccess = ()=> resolve(req.result || null);
      req.onerror = ()=> resolve(null);
    });
  }catch(e){ return null; }
}
async function idbSet(key, value){
  try{
    const idb = await idbOpen();
    const tx = idb.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put(value, key);
  }catch(e){ /* cache gagal, tidak masalah, tetap jalan tanpa cache */ }
}

async function idbDel(key){
  try{
    const idb = await idbOpen();
    idb.transaction(IDB_STORE,'readwrite').objectStore(IDB_STORE).delete(key);
  }catch(e){}
}
function escHtml(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function rpFmt(n){ return 'Rp ' + Math.abs(Number(n)||0).toLocaleString('id-ID'); }

// Upload per-chunk dengan concurrency terbatas (bukan satu batch raksasa) +
// progress callback, supaya file besar (Stock Cabang Lain) lebih cepat & terlihat progresnya.
async function pushToFirestore(collectionName, rows, metaKey, onProgress, chunkSize){
  const chunks = [];
  const cs = chunkSize || CHUNK_SIZE;
  for(let i=0;i<rows.length;i+=cs) chunks.push(rows.slice(i,i+cs));
  const metaRef = db.collection('meta').doc(metaKey);
  const metaSnap = await metaRef.get();
  const oldCount = metaSnap.exists ? (metaSnap.data().chunkCount || 0) : 0;

  let done = 0;
  const CONCURRENCY = 6;
  let nextIdx = 0;
  async function worker(){
    while(nextIdx < chunks.length){
      const my = nextIdx++;
      await db.collection(collectionName).doc('chunk_'+my).set({ rows: chunks[my] });
      done++;
      if(onProgress) onProgress(done, chunks.length);
    }
  }
  await Promise.all(Array.from({length: Math.min(CONCURRENCY, chunks.length)||1}, worker));

  const deletes = [];
  for(let i=chunks.length; i<oldCount; i++){
    deletes.push(db.collection(collectionName).doc('chunk_'+i).delete());
  }
  await Promise.all(deletes);

  const updatedAt = new Date().toISOString();
  await metaRef.set({ chunkCount: chunks.length, updatedAt });
  idbSet(metaKey, { updatedAt, rows }); // simpan ke cache lokal juga supaya viewer lain yg reload cepat
  return updatedAt;
}
async function loadFromFirestore(collectionName, metaKey, tagChunk, knownUpdatedAt){
  const metaSnap = await db.collection('meta').doc(metaKey).get();
  if(!metaSnap.exists) return { rows: [], updatedAt: '' };
  const { chunkCount, updatedAt } = metaSnap.data();
  if(knownUpdatedAt && knownUpdatedAt === updatedAt) return { same: true, updatedAt };

  const cached = await idbGet(metaKey);
  if(cached && cached.updatedAt === updatedAt){
    return { rows: cached.rows, updatedAt }; // data belum berubah, tidak perlu download ulang
  }

  const snaps = await Promise.all(
    Array.from({length: chunkCount}, (_,i)=> db.collection(collectionName).doc('chunk_'+i).get())
  );
  const rows = [];
  snaps.forEach((s,i)=>{
    if(!s.exists) return;
    const chunkRows = s.data().rows;
    if(tagChunk) chunkRows.forEach(r=>{ r._chunkIdx = i; }); // dipakai saat checkout untuk tahu dokumen mana yang perlu diubah
    rows.push(...chunkRows);
  });
  idbSet(metaKey, { updatedAt, rows }); // simpan ke cache lokal untuk kunjungan berikutnya
  return { rows, updatedAt };
}
function fmtDate(iso){ return iso ? new Date(iso).toLocaleString('id-ID') : ''; }

const DATA_SETS = [
  {key:'priceList',     field:'items',         upd:'itemsUpdated'},
  {key:'serialNumber',  field:'serialNumber',  upd:'serialUpdated'},
  {key:'stockCabang',   field:'stockCabang',   upd:'cabangUpdated'},
  {key:'barcode',       field:'barcode',       upd:'barcodeUpdated'},
  {key:'manualSupport', field:'manualSupport', upd:'manualSupportUpdated'}
];
const _ver = {};
let _rebuildTimer = null;
function scheduleRebuild(){
  clearTimeout(_rebuildTimer);
  _rebuildTimer = setTimeout(()=>{ buildIndices(); refreshAfterLoad(); }, 40);
}
// Setelah data berubah: perbarui info & hasil tanpa membuang kotak pencarian yang sedang diketik.
function refreshAfterLoad(){
  const hint = document.getElementById('dataHint');
  if(hint && document.getElementById('resultBody')){
    hint.innerHTML = stokHintHtml();
    refreshFilterUi();
    runSearchAndRenderBody();
  } else if(state.tab !== 'upload' || !state.staffMode){ render(); }
}
// Tampilkan data dari cache lokal dulu (instan), baru cek versi terbaru di server di latar belakang
// dan hanya unduh dataset yang memang sudah berubah.
async function loadAll(){
  state.loaded = true;
  const caches = await Promise.all(DATA_SETS.map(d=> idbGet(d.key)));
  let any = false;
  DATA_SETS.forEach((d,i)=>{
    const c = caches[i];
    if(c && c.rows){ state[d.field] = c.rows; state[d.upd] = fmtDate(c.updatedAt); _ver[d.key] = c.updatedAt; any = true; }
  });
  if(any) buildIndices();
  state.pending = DATA_SETS.length;
  render();
  await Promise.all(DATA_SETS.map(async d=>{
    try{
      const r = await loadFromFirestore(d.key, d.key, false, _ver[d.key]);
      if(!r.same){
        state[d.field] = r.rows || []; state[d.upd] = fmtDate(r.updatedAt); _ver[d.key] = r.updatedAt;
        scheduleRebuild();
      }
    }catch(e){ state.loadFail = true; }
    state.pending--;
    if(state.pending === 0) refreshAfterLoad();
  }));
}

function buildIndices(){
  // Price list baru hanya berisi {itemNo, harga}. Baris format lama (punya gudang/available) tetap dibaca sebagai cadangan.
  const priceMap = {};
  const legacy = {};
  state.items.forEach(it=>{
    if(it.harga > 0 && !(it.itemNo in priceMap)) priceMap[it.itemNo] = it.harga;
    if(it.gudang !== undefined){
      it._noL = it.itemNo.toLowerCase(); it._dsL = (it.deskripsi||'').toLowerCase();
      (legacy[it.itemNo] = legacy[it.itemNo] || []).push(it);
    }
  });
  state.priceMap = priceMap;
  state.serialNumber.forEach(sn=>{ sn._codeL = sn.itemCode.toLowerCase(); sn._dsL = sn.deskripsi.toLowerCase(); sn._snL = sn.serial.toLowerCase(); });
  state.stockCabang.forEach(sc=>{
    if(!sc.own && !sc.other && sc.gudang) sc.other = [{g: sc.gudang, a: null}]; // data format lama
    sc._noL = sc.itemNo.toLowerCase(); sc._dsL = (sc.deskripsi||'').toLowerCase();
  });
  state.barcode.forEach(bc=>{ bc._noL = bc.itemNo.toLowerCase(); bc._dsL = bc.deskripsi.toLowerCase(); bc._bcL = bc.barcode.toLowerCase(); });
  state.manualSupport.forEach(m=>{ m._dsL = m.deskripsi.toLowerCase(); m._bcL = (m.barcode||'').toLowerCase(); });
  const idx1 = legacy;
  const idx2 = {}; state.serialNumber.forEach(sn=>{ (idx2[sn.itemCode] = idx2[sn.itemCode] || []).push(sn); });
  const idx3 = {}; state.stockCabang.forEach(sc=>{ (idx3[sc.itemNo] = idx3[sc.itemNo] || []).push(sc); });
  const idx4 = {}; state.barcode.forEach(bc=>{ (idx4[bc.itemNo] = idx4[bc.itemNo] || []).push(bc); });
  const idx5 = {}; state.manualSupport.forEach(m=>{ idx5[m._dsL] = m; }); // sudah teragregasi 1 baris per deskripsi
  state.itemsIndex = idx1; state.serialIndex = idx2; state.cabangIndex = idx3; state.barcodeIndex = idx4; state.manualIndex = idx5;

  // deskripsi yang sudah "dikenal" lewat Item No. asli (dari salah satu sumber data utama)
  const known = new Set();
  state.items.forEach(it=>{ if(it._dsL !== undefined) known.add(it._dsL); });
  state.serialNumber.forEach(sn=> known.add(sn._dsL));
  state.stockCabang.forEach(sc=> known.add(sc._dsL));
  state.barcode.forEach(bc=> known.add(bc._dsL));
  state.knownDescSet = known;
  state.dataVer++;
}

// ---------------- Auth ----------------
// Skema Leasing HANYA dimuat setelah login staff, dan dibuang lagi saat keluar mode staff.
function applyLeasing(rows, updatedAt){
  state.leasingHeader = rows.find(r=>r.t==='h') || null;
  state.leasingRows = rows.filter(r=>r.t==='i');
  state.leasingUpdated = fmtDate(updatedAt);
}
async function loadLeasing(){
  try{
    const r = await loadFromFirestore('leasingScheme', 'leasingScheme');
    applyLeasing(r.rows, r.updatedAt);
    state.leasingErr = '';
  }catch(e){ state.leasingErr = 'Gagal memuat skema leasing (cek aturan Firestore & koneksi).'; }
  if(state.staffMode && state.loaded) render();
}
function clearLeasing(){
  state.leasingHeader = null; state.leasingRows = []; state.leasingUpdated = ''; state.leasingErr = '';
  state.skemaQuery = ''; state.skemaProvider = null;
  idbDel('leasingScheme');
}
auth.onAuthStateChanged(user=>{
  state.staffMode = !!user;
  if(user){ loadLeasing(); }
  else { clearLeasing(); if(state.tab==='skema' || state.tab==='kasir') state.tab = 'stok'; }
  if(state.loaded) render();
});

// ---------------- UI ----------------
function render(){
  const staffBtn = document.getElementById('staffBtn');
  staffBtn.textContent = state.staffMode ? 'Keluar Mode Staff' : 'Masuk Mode Staff';
  staffBtn.className = state.staffMode ? 'small ghost' : 'small';
  staffBtn.onclick = () => {
    if(state.staffMode){ auth.signOut(); }
    else { state.showLogin = true; state.loginErr=''; render(); }
  };

  const app = document.getElementById('app');
  if(!state.staffMode){
    app.innerHTML = `
      <div class="tabs" id="publicTabs">
        <div class="tab ${state.publicView==='stok'?'active':''}" data-pubtab="stok">Cek Stok</div>
        <div class="tab ${state.publicView==='promotor'?'active':''}" data-pubtab="promotor">Stock Promotor</div>
      </div>
      <div id="publicBody"></div>`;
    document.getElementById('publicBody').innerHTML = state.publicView==='promotor' ? promotorView() : stokView();
    document.querySelectorAll('#publicTabs .tab').forEach(el=>el.onclick=()=>{ state.publicView = el.dataset.pubtab; render(); });
    if(state.publicView==='promotor') bindPromotor(); else bindStok();
  } else {
    app.innerHTML = `
      <div class="tabs">${tabBtn('stok','Cek Stok')}${tabBtn('skema','Skema Leasing')}${tabBtn('kasir','Kasir'+kasirBadge())}${tabBtn('upload','Upload Excel')}</div>
      <div id="tabBody"></div>`;
    document.getElementById('tabBody').innerHTML = state.tab === 'stok' ? stokView() : (state.tab === 'skema' ? skemaView() : (state.tab === 'kasir' ? kasirView() : uploadView()));
    document.querySelectorAll('.tabs > .tab').forEach(el=>el.onclick=()=>{ state.tab = el.dataset.tab; render(); });
    if(state.tab==='stok') bindStok(); if(state.tab==='skema') bindSkema(); if(state.tab==='kasir') bindKasir(); if(state.tab==='upload') bindUpload();
  }
  renderLoginOverlay();
}
function tabBtn(id,label){ return `<div class="tab ${state.tab===id?'active':''}" data-tab="${id}">${label}</div>`; }

function renderLoginOverlay(){
  let existing = document.getElementById('loginOverlay');
  if(existing) existing.remove();
  if(!state.showLogin) return;
  const div = document.createElement('div');
  div.className = 'overlay'; div.id = 'loginOverlay';
  div.innerHTML = `<div class="modal">
      <h2>Masuk Mode Staff Gudang</h2>
      <input type="password" id="pinInput" inputmode="numeric" placeholder="Masukkan PIN staff">
      <div class="err">${state.loginErr}</div>
      <div style="display:flex;gap:8px;">
        <button id="loginSubmit">Masuk</button>
        <button class="ghost" id="loginCancel">Batal</button>
      </div>
    </div>`;
  document.body.appendChild(div);
  document.getElementById('pinInput').focus();
  const submit = async ()=>{
    const pin = document.getElementById('pinInput').value.trim();
    if(pin !== STAFF_ACCOUNT.pin){ state.loginErr = 'PIN salah.'; renderLoginOverlay(); return; }
    try{
      await auth.signInWithEmailAndPassword(STAFF_ACCOUNT.email, STAFF_ACCOUNT.password);
      state.showLogin = false; state.tab = 'upload'; render();
    }catch(err){ state.loginErr = 'Gagal masuk, cek konfigurasi akun staff.'; renderLoginOverlay(); }
  };
  document.getElementById('loginSubmit').onclick = submit;
  document.getElementById('pinInput').onkeydown = (e)=>{ if(e.key==='Enter') submit(); };

function memoFilterOptions(){
  if(_catMemo.v === state.dataVer) return _catMemo;
  const cats = new Set(), brands = new Set();
  [state.itemsIndex, state.serialIndex, state.cabangIndex, state.barcodeIndex].forEach(idx=>{
    Object.keys(idx).forEach(k=>{
      const parts = k.split('.');
      const p = parts[0];
      if(p && !HIDDEN_CATEGORIES.has(p)) cats.add(p);
      if(parts[1] && !/^\d+$/.test(parts[1])) brands.add(parts[1]);
    });
  });
  if(cats.has('GAD')) cats.add('GAD-LDU');
  _catMemo = {v: state.dataVer, cats: Array.from(cats).sort(), brands: Array.from(brands).sort()};
  return _catMemo;
}

function parseTgl(str){
  if(!str) return null;
  const parts = String(str).split(/[\/\-]/);
  if(parts.length !== 3) return null;
  let [d,m,y] = parts.map(x=>parseInt(x,10));
  if(y < 100) y += 2000;
  const dt = new Date(y, m-1, d);
  return isNaN(dt.getTime()) ? null : dt;
}
function buildResults(q){
  q = q.toLowerCase();
  let keySet, manualOnlyKeys = [];
  if(q){
    keySet = new Set();
    state.items.forEach(it=>{ if(it._noL !== undefined && (it._noL.includes(q)||it._dsL.includes(q))) keySet.add(it.itemNo); });
    state.serialNumber.forEach(sn=>{ if(sn._codeL.includes(q)||sn._dsL.includes(q)||sn._snL.includes(q)) keySet.add(sn.itemCode); });
    state.stockCabang.forEach(sc=>{ if(sc._noL.includes(q)||sc._dsL.includes(q)) keySet.add(sc.itemNo); });
    state.barcode.forEach(bc=>{ if(bc._noL.includes(q)||bc._dsL.includes(q)||bc._bcL.includes(q)) keySet.add(bc.itemNo); });
    // item yang HANYA ada di file manual (tidak dikenal lewat Item No. di sumber manapun) tetap muncul sendiri
    state.manualSupport.forEach(m=>{
      if((m._dsL.includes(q)||m._bcL.includes(q)) && !state.knownDescSet.has(m._dsL)) manualOnlyKeys.push('MANUAL::'+m._dsL);
    });
  } else {
    keySet = new Set([...Object.keys(state.itemsIndex), ...Object.keys(state.serialIndex), ...Object.keys(state.cabangIndex), ...Object.keys(state.barcodeIndex)]);
  }
  let keys = Array.from(keySet);
  const F = state.filters;
  if(F.tipe.length || F.brand.length || F.jenis.length){
    keys = keys.filter(k=>{
      const desc = descOfKey(k);
      if(F.tipe.length && !F.tipe.includes(itemTipe(k, desc))) return false;
      if(F.brand.length){
        const b = k.split('.')[1];
        if(!(F.brand.includes(b) || (F.brand.includes('__other') && !MAIN_BRANDS.includes(b)))) return false;
      }
      if(F.jenis.length && !itemJenis(desc).some(j=>F.jenis.includes(j))) return false;
      return true;
    });
  }
  const results = keys.map(itemNo=>{
    const snRows = state.serialIndex[itemNo] || [];
    const scRows = state.cabangIndex[itemNo] || [];
    const bcRows = state.barcodeIndex[itemNo] || [];
    const legacyRows = state.itemsIndex[itemNo] || [];
    const deskripsi = (scRows[0]&&scRows[0].deskripsi) || (snRows[0]&&snRows[0].deskripsi) || (bcRows[0]&&bcRows[0].deskripsi) || (legacyRows[0]&&legacyRows[0].deskripsi) || '';
    let barcode = bcRows[0] ? bcRows[0].barcode : '';
    let barcodeFromManual = false;
    const ownByGudang = {};
    const otherGudang = new Map(); // kode gudang -> jumlah available (null kalau tidak diketahui)
    const addOther = (g, a)=>{
      if(a == null){ if(!otherGudang.has(g)) otherGudang.set(g, null); }
      else otherGudang.set(g, (otherGudang.get(g)||0) + a);
    };
    snRows.forEach(sn=>{
      if(OWN_WAREHOUSES.includes(sn.gudang)) (ownByGudang[sn.gudang]=ownByGudang[sn.gudang]||[]).push(sn);
      else if(sn.gudang) addOther(sn.gudang, null);
    });
    const price = state.priceMap[itemNo] || 0;
    const ownStock = [];
    scRows.forEach(sc=>{
      (sc.own||[]).forEach(o=> ownStock.push({gudang:o.g, available:o.a, allocated:o.al}));
      (sc.other||[]).forEach(o=> addOther(o.g, o.a));
    });
    // lengkapi dari file manual: barcode jika belum ada, dan harga referensi jika harga resmi tidak ada
    let manualHarga = 0;
    const manualEntry = deskripsi ? state.manualIndex[deskripsi.toLowerCase()] : null;
    if(manualEntry){
      if(!barcode && manualEntry.barcode){ barcode = manualEntry.barcode; barcodeFromManual = true; }
      if(!price && manualEntry.harga) manualHarga = manualEntry.harga;
      (manualEntry.gudangList||[]).forEach(g=> addOther(g, null));
    }
    const effPrice = price || manualHarga;
    const plRows = ownStock.length
      ? ownStock.map(o=> Object.assign({}, o, {harga: effPrice}))
      : legacyRows.map(p=> Object.assign({}, p, {harga: effPrice || p.harga}));
    return {itemNo, deskripsi, barcode, barcodeFromManual, price, manualHarga, plRows, ownByGudang, otherGudang};
  });
  const manualOnlyResults = manualOnlyKeys.map(key=>{
    const dsL = key.slice('MANUAL::'.length);
    const m = state.manualIndex[dsL];
    return {
      itemNo: '(data manual)', deskripsi: m.deskripsi, barcode: m.barcode, barcodeFromManual: !!m.barcode,
      price: 0, manualHarga: m.harga||0, plRows: [], ownByGudang: {}, otherGudang: new Map((m.gudangList||[]).map(g=>[g,null])), manualOnly: true
    };
  });
  // item "data manual" tidak punya Item No. asli, jadi tidak ikut filter brand/tipe, tapi tetap bisa difilter jenis
  let manualPart = manualOnlyResults;
  if(F.tipe.length || F.brand.length) manualPart = [];
  else if(F.jenis.length) manualPart = manualPart.filter(r=> itemJenis(r.deskripsi).some(j=>F.jenis.includes(j)));
  let all = results.concat(manualPart);
  if(F.xs.length) all = all.filter(r=> /\(\s*xs\s*\)/i.test(r.deskripsi||''));
  if(F.harga.length){
    const bands = HARGA_OPTS.filter(o=>F.harga.includes(o.id));
    all = all.filter(r=>{ const pr = recPrice(r); return pr > 0 && bands.some(b=> pr > b.lo && pr <= b.hi); });
  }
  if(F.status.length) all = all.filter(r=> F.status.includes(recStatus(r)));
  return all;
}
function itemCardHtml(rec, idx){
  const plTable = rec.plRows.length ? `
    <div class="tablewrap"><table>
      <thead><tr><th>Warehouse Code</th><th>Available</th><th>Allocated</th><th>Harga</th></tr></thead>
      <tbody>${rec.plRows.map(it=>`<tr><td>${it.gudang}</td><td>${it.available}</td><td>${it.allocated}</td>
        <td>Rp${Number(it.harga||0).toLocaleString('id-ID')}</td></tr>`).join('')}</tbody>
    </table></div>` : `<div class="muted">Tidak ada stok di gudang sendiri.</div>${(rec.price||rec.manualHarga) ? `<div style="margin:2px 0 10px;font-weight:600;">Harga: Rp${Number(rec.price||rec.manualHarga).toLocaleString('id-ID')}${rec.price ? '' : ' <span class="muted">(referensi manual)</span>'}</div>` : ''}`;
  const ownSerialBlocks = Object.keys(rec.ownByGudang).map(gudang=>{
    const list = rec.ownByGudang[gudang].slice().sort((a,b)=>{
      const da=parseTgl(a.tanggal), db_=parseTgl(b.tanggal); return (da&&db_) ? da-db_ : 0;
    });
    const oldest = list.reduce((min,x)=>{ const d=parseTgl(x.tanggal); return d&&(!min||d<min)?d:min; }, null);
    const chips = list.map(sn=>{
      const d = parseTgl(sn.tanggal);
      const isOld = oldest && d && d.getTime()===oldest.getTime();
      const statusLabel = sn.status ? ` &middot; ${sn.status}` : '';
      const allocClass = /allocated/i.test(sn.status||'') ? ' allocated' : '';
      return `<span class="snChip ${isOld?'old':''}${allocClass}">${sn.serial} &middot; ${sn.tanggal||'-'}${statusLabel}${isOld?' (FIFO)':''}</span>`;
    }).join('');
    return `<div class="snGroupLabel">Serial Number &mdash; ${gudang}</div><div class="snList">${chips}</div>`;
  }).join('');
  const hasReadyOwn = rec.plRows.some(r=> (r.available||0) > 0);
  const indentList = Array.from(rec.otherGudang.entries()).map(([g,a])=> a != null ? `${g} (${a})` : g).join(', ');
  const indent = rec.otherGudang.size ? (
    hasReadyOwn
      ? `<details class="indentDetails"><summary>Status: Indent (klik untuk lihat gudang lain)</summary><div class="indentList">Tersedia di gudang: ${indentList}</div></details>`
      : `<div class="indentBox">Status: Indent &mdash; tersedia di gudang: ${indentList}</div>`
  ) : '';
  const barcodeLine = rec.barcode ? `<div class="muted" style="margin:-4px 0 10px;">Barcode: ${rec.barcode}${rec.barcodeFromManual ? ' (manual)' : ''}</div>` : '';
  const body = rec.manualOnly ? `${barcodeLine}${rec.manualHarga ? `<div style="margin:2px 0 10px;font-weight:600;">Harga: Rp${Number(rec.manualHarga).toLocaleString('id-ID')} <span class="muted">(referensi manual)</span></div>` : ''}${indent}`
    : `${barcodeLine}${plTable}${ownSerialBlocks}${indent}`;
  const kBtn = (state.staffMode && idx !== undefined) ? `<button class="small ghost kasirAdd" data-idx="${idx}" style="float:right;margin-left:8px;">+ Kasir</button>` : '';
  return `<div class="itemCard">${kBtn}<h3>${rec.deskripsi} <span class="itemNo">(${rec.itemNo})</span></h3>${body}</div>`;
}

const RESULT_CAP = 40;
let _shownResults = [];
let searchTimer = null;
function runSearchAndRenderBody(){
  const body = document.getElementById('resultBody');
  if(!body) return;
  const q = state.query.trim();
  const hasData = state.items.length||state.serialNumber.length||state.stockCabang.length;
  if(!q && !filtersActive()){
    body.innerHTML = hasData ? '<div class="muted">Ketik untuk mulai mencari, atau buka Filter.</div>' : (state.pending>0 ? '<div class="muted">Memuat data...</div>' : '<div class="muted">Belum ada data.</div>');
    return;
  }
  const results = buildResults(q);
  if(!results.length){ body.innerHTML = state.pending>0 && !hasData ? '<div class="muted">Memuat data...</div>' : '<div class="muted">Tidak ditemukan.</div>'; return; }
  const shown = results.slice(0, RESULT_CAP);
  _shownResults = shown;
  let html = shown.map((r,i)=>itemCardHtml(r,i)).join('');
  if(results.length > RESULT_CAP) html += `<div class="muted">Menampilkan ${RESULT_CAP} dari ${results.length} hasil.</div>`;
  body.innerHTML = html;
}

function skemaStatus(v, e){
  // v: 'Y' (centang) | 'N' (silang) | angka | '' (tidak ada data)
  if(v === 'Y') return {cls:'ok', text:'Tanpa admin tambahan'};
  if(v === 'N'){
    return e > 0 ? {cls:'pay', text:'Admin tambahan '+rpFmt(e)+' (ikut kolom E)'} : {cls:'ok', text:'Tanpa admin tambahan (kolom E = 0)'};
  }
  if(typeof v === 'number'){
    if(v > 0) return {cls:'pay', text:'Admin tambahan '+rpFmt(v)+' (dibayar pembeli)'};
    if(v < 0) return {cls:'pay', text:'Admin kurang disubsidi, pembeli bayar selisih '+rpFmt(v)};
    return {cls:'ok', text:'Tanpa admin tambahan'};
  }
  return {cls:'na', text:'Tidak ada data'};
}
function skemaGroups(){
  const h = state.leasingHeader; if(!h) return [];
  const groups = [];
  h.s.forEach((sc,i)=>{
    let g = groups.find(x=>x.name===sc.g);
    if(!g){ g = {name: sc.g, idx: []}; groups.push(g); }
    g.idx.push(i);
  });
  return groups;
}
function skemaView(){
  if(!state.leasingHeader){
    return `<div class="card muted">${state.leasingErr ? escHtml(state.leasingErr) : 'Belum ada data Skema Leasing. Upload dulu di tab Upload Excel (blok 4).'}</div>`;
  }
  const chip = (id,label)=> `<div class="tab ${state.skemaProvider===id?'active':''}" data-prov="${id===null?'':escHtml(id)}">${escHtml(label)}</div>`;
  const chips = chip(null,'Semua') + chip('__baf','BAF / MEGAZIP') + skemaGroups().map(g=>chip(g.name,g.name)).join('');
  return `<div class="card">
    <input type="text" id="skemaBox" placeholder="Cari nama item / brand..." value="${escHtml(state.skemaQuery)}" autocomplete="off">
    <div class="tabs catRow" id="skemaChips">${chips}</div>
    <div class="muted" style="margin-bottom:10px;">Data skema: ${escHtml(state.leasingUpdated)} (${state.leasingRows.length} item)</div>
    <div class="skHead">${escHtml(state.leasingHeader.note||'')}</div>
    <div id="skemaBody" style="margin-top:12px;"></div>
  </div>`;
}
function skemaItemHtml(it){
  const h = state.leasingHeader, prov = state.skemaProvider;
  const e = Number(it.e)||0;
  let head = `<div class="itemCard" style="margin-bottom:14px;">
    <div><b>${escHtml(it.n)}</b> <span class="itemNo">${escHtml(it.b)}</span></div>
    <div class="muted">SRP ${rpFmt(it.srp)} &middot; Harga setelah CB ${rpFmt(it.cb)}</div>`;
  const bafStatus = e > 0 ? {cls:'pay', text:'Admin tambahan '+rpFmt(e)} : {cls:'ok', text:'Tanpa admin tambahan'};
  head += `<div class="skRow"><span class="skL">BAF / MEGAZIP (kolom E)</span><span class="skV ${bafStatus.cls}">${escHtml(bafStatus.text)}</span></div>`;
  if(prov !== '__baf'){
    skemaGroups().forEach(g=>{
      if(prov && g.name !== prov) return;
      const rows = g.idx.map(i=>{
        const st = skemaStatus(it.v[i], e);
        return `<div class="skRow"><span class="skL">${escHtml(h.s[i].l)}</span><span class="skV ${st.cls}">${escHtml(st.text)}</span></div>`;
      }).join('');
      head += `<details class="skGroup" ${prov ? 'open' : ''}><summary>${escHtml(g.name)} (${g.idx.length} skema)</summary>${rows}</details>`;
    });
  }
  return head + '</div>';
}
function runSkema(){
  const body = document.getElementById('skemaBody'); if(!body) return;
  const words = state.skemaQuery.toLowerCase().split(/\s+/).filter(Boolean);
  if(!words.length){ body.innerHTML = '<div class="muted">Ketik nama item untuk mengecek skema leasing-nya.</div>'; return; }
  const res = state.leasingRows.filter(it=>{
    const t = (it.b+' '+it.n).toLowerCase();
    return words.every(w=>t.includes(w));
  });
  if(!res.length){ body.innerHTML = '<div class="muted">Tidak ditemukan.</div>'; return; }
  const cap = 15;
  body.innerHTML = res.slice(0,cap).map(skemaItemHtml).join('') + (res.length>cap ? `<div class="muted">Menampilkan ${cap} dari ${res.length} hasil, persempit pencarian.</div>` : '');
}
let skemaTimer = null;
function bindSkema(){
  const box = document.getElementById('skemaBox'); if(!box){ return; }
  box.oninput = ()=>{ state.skemaQuery = box.value; clearTimeout(skemaTimer); skemaTimer = setTimeout(runSkema, 200); };
  document.querySelectorAll('#skemaChips .tab').forEach(c=>{
    c.onclick = ()=>{ const v = c.dataset.prov || null; state.skemaProvider = (v===null || state.skemaProvider===v) ? null : v; render(); };
  });
  runSkema();
}

// ---------- Kasir (catatan transaksi, khusus mode staff) ----------
// Hanya catatan untuk membantu input ke komputer: TIDAK mengubah stok. Disimpan di browser perangkat ini (localStorage),
// jadi tidak membebani database dan tidak mempengaruhi kecepatan pencarian.
const KASIR_SALES = ['Fariz','Khalifah','Hanna','Tiara','Meli','Diana'];
const KASIR_BAYAR = ['Cash or Transfer','Qris','SpayLater Limit Extra','Kredivo','SF+','Debit','AkuLaku','Promo'];
const KASIR_KEY = 'kasirCatatanV1';
let _kasir = null;
function kasirData(){
  if(_kasir) return _kasir;
  try{ const raw = localStorage.getItem(KASIR_KEY); _kasir = raw ? JSON.parse(raw) : null; }catch(e){ _kasir = null; }
  if(!_kasir || !Array.isArray(_kasir.txns)) _kasir = {txns: [], active: null};
  _kasir.txns.forEach(t=>{ // data lama: potongan negatif = biaya admin
    t.items.forEach(i=>{ if(i.disc === undefined){ i.disc = 0; i.discType = 'rp'; } });
    if(t.admin === undefined){ t.admin = 0; t.adminType = t.discType || 'rp'; if((Number(t.disc)||0) < 0){ t.admin = -t.disc; t.disc = 0; } }
  });
  return _kasir;
}
function kasirSave(){ try{ localStorage.setItem(KASIR_KEY, JSON.stringify(_kasir)); }catch(e){} }
function kasirBadge(){ const n = kasirData().txns.length; return n ? ` (${n})` : ''; }
function kasirUpdateBadge(){
  const el = document.querySelector('.tabs > .tab[data-tab="kasir"]');
  if(el) el.textContent = 'Kasir' + kasirBadge();
}
function kasirNewTxn(){
  const k = kasirData();
  const t = {id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), sales:'', bayar:'', items:[], disc:0, discType:'rp', admin:0, adminType:'rp', note:''};
  k.txns.push(t); k.active = t.id; kasirSave();
  return t;
}
function kasirActive(){
  const k = kasirData();
  return k.txns.find(t=>t.id===k.active) || k.txns[k.txns.length-1] || null;
}
function kasirToast(msg){
  const old = document.getElementById('kToast'); if(old) old.remove();
  const el = document.createElement('div'); el.id = 'kToast'; el.className = 'kToast'; el.textContent = msg;
  document.body.appendChild(el); setTimeout(()=>{ el.remove(); }, 1800);
}
function kasirAddItem(rec){
  const k = kasirData();
  let t = kasirActive() || kasirNewTxn();
  k.active = t.id;
  const key = rec.itemNo === '(data manual)' ? 'M::'+rec.deskripsi : rec.itemNo;
  const price = Number(recPrice(rec)) || 0;
  const ex = t.items.find(i=>i.key===key);
  if(ex) ex.qty += 1;
  else t.items.push({key, no: rec.itemNo, ds: rec.deskripsi, base: price, price, qty: 1, disc: 0, discType: 'rp', sn: '', bc: rec.barcode || ''});
  kasirSave(); kasirUpdateBadge();
  if(document.getElementById('kBody')){ kasirRenderTabs(); kasirRenderBody(); }
  kasirToast('Ditambahkan ke Transaksi '+(k.txns.indexOf(t)+1)+' ('+(ex ? 'qty '+ex.qty : 'baru')+')');
}
// Potongan nego diisi per item dan berlaku untuk total baris item itu (harga x jumlah).
function kasirBarcode(i){
  if(i.bc) return i.bc;
  const r = (state.barcodeIndex && state.barcodeIndex[i.no]) || [];
  return r[0] ? r[0].barcode : '';
}
function kasirLine(i){
  const gross = (Number(i.price)||0) * (Number(i.qty)||0);
  let d = Math.max(Number(i.disc)||0, 0);
  if(i.discType === 'pct') d = Math.round(gross * Math.min(d,100) / 100);
  d = Math.min(d, gross);
  return {gross, d, net: gross - d};
}
function kasirCalc(t){
  let gross = 0, itemDisc = 0;
  t.items.forEach(i=>{ const l = kasirLine(i); gross += l.gross; itemDisc += l.d; });
  const sub = gross - itemDisc;
  // potongan transaksi (hanya dari catatan lama), lalu biaya admin dihitung dari subtotal setelah semua potongan
  let disc = Math.max(Number(t.disc)||0, 0);
  if(t.discType === 'pct') disc = Math.round(sub * Math.min(disc,100) / 100);
  disc = Math.min(disc, sub);
  const base = sub - disc;
  let admin = Math.max(Number(t.admin)||0, 0);
  if(t.adminType === 'pct') admin = Math.round(base * admin / 100);
  return {gross, itemDisc, sub, disc, admin, total: base + admin};
}
function kasirRp(n){ n = Number(n)||0; return (n<0?'-':'') + 'Rp' + Math.abs(n).toLocaleString('id-ID'); }
function kasirSummaryText(t){
  const c = kasirCalc(t);
  const lines = [];
  lines.push('Sales: '+(t.sales||'-')+' | Bayar: '+(t.bayar||'-'));
  t.items.forEach((i,n)=>{
    const l = kasirLine(i);
    lines.push((n+1)+'. '+i.ds+' ('+i.no+')'+(kasirBarcode(i) ? ' [BC: '+kasirBarcode(i)+']' : '')+' x'+i.qty+' @'+kasirRp(i.price)+(l.d ? ' | nego -'+kasirRp(l.d)+(i.discType==='pct' ? ' ('+i.disc+'%)' : '') : '')+' = '+kasirRp(l.net)+(i.sn ? ' | SN/Ket: '+i.sn : ''));
  });
  if(c.disc > 0) lines.push('Potongan transaksi: -'+kasirRp(c.disc)+(t.discType==='pct' ? ' ('+t.disc+'%)' : ''));
  if(c.admin > 0) lines.push('Biaya admin: +'+kasirRp(c.admin)+(t.adminType==='pct' ? ' ('+t.admin+'%)' : ''));
  lines.push('TOTAL: '+kasirRp(c.total));
  if(t.note) lines.push('Catatan: '+t.note);
  return lines.join('\n');
}
let _kQuery = '', _kHits = [], _kTimer = null;
function kasirView(){
  return `<div class="card">
    <h2>Kasir</h2>
    <div class="hint">Catatan untuk membantu input ke komputer. <b>Tidak mengurangi stok.</b> Tersimpan di perangkat ini saja. Tambah item lewat tombol <b>+ Kasir</b> di tab Cek Stok.</div>

function kasirUpdateTotals(t){
  const c = kasirCalc(t);
  const set = (id,v)=>{ const e = document.getElementById(id); if(e) e.textContent = v; };
  set('kSubtotal', kasirRp(c.gross)); set('kItemDisc', '-'+kasirRp(c.itemDisc)); set('kDiscAmt', '-'+kasirRp(c.disc)); set('kAdminAmt', '+'+kasirRp(c.admin)); set('kTotal', kasirRp(c.total));
  t.items.forEach(i=>{ const l = kasirLine(i), sid = i.key.replace(/[^A-Za-z0-9]/g,'_'); set('kSub_'+sid, kasirRp(l.net)); set('kND_'+sid, l.d ? 'nego -'+kasirRp(l.d) : ''); });
  kasirRenderTabsLabelsOnly();
}
function kasirRenderTabsLabelsOnly(){
  const k = kasirData();
  document.querySelectorAll('#kTabs .tab[data-kid]').forEach((el,i)=>{
    const t = k.txns[i]; if(t) el.innerHTML = `${i+1}. ${escHtml(t.sales||'Baru')} &middot; ${kasirRp(kasirCalc(t).total)}`;

        <span class="muted" id="kND_${sid}">${kasirLine(i).d ? 'nego -'+kasirRp(kasirLine(i).d) : ''}</span>

  const c = kasirCalc(t);

  sel('kSales', e=>{ t.sales = e.target.value; kasirSave(); kasirRenderTabsLabelsOnly(); });
  sel('kBayar', e=>{ t.bayar = e.target.value; kasirSave(); });
  sel('kDiscType', e=>{ t.discType = e.target.value; kasirSave(); kasirUpdateTotals(t); });
  const kd = document.getElementById('kDisc'); if(kd) kd.oninput = e=>{ t.disc = Math.max(Number(e.target.value)||0, 0); kasirSave(); kasirUpdateTotals(t); };
  document.getElementById('kAdmin').oninput = e=>{ t.admin = Math.max(Number(e.target.value)||0, 0); kasirSave(); kasirUpdateTotals(t); };

    row.querySelector('.kPlus').onclick = ()=> setQty(it.qty+1);
    qtyEl.onchange = ()=> setQty(Number(qtyEl.value));

    const idEl = row.querySelector('.kItemDisc'), idType = row.querySelector('.kItemDiscType');

    kasirRenderTabs(); kasirRenderBody(); kasirUpdateBadge();
  };
  document.getElementById('kDone').onclick = ()=>{
    if(!t.items.length || confirm('Tandai selesai? Catatan transaksi ini akan langsung dihapus.')) removeTxn();
  };
  document.getElementById('kCancel').onclick = ()=>{
    if(!t.items.length || confirm('Batalkan transaksi ini? Catatan akan dihapus.')) removeTxn();
  };
}
function kasirRenderHits(){
  const box = document.getElementById('kSearchRes'); if(!box) return;
  const q = _kQuery.trim();
  if(!q){ box.innerHTML = ''; _kHits = []; return; }
  // Ready & Ready-Indent paling atas, lalu Indent, terakhir yang kosong
  const rank = {'ready':0,'ready-indent':0,'indent':1,'':2};
  _kHits = buildResults(q).map((r,i)=>({r,i,k:rank[recStatus(r)]})).sort((a,b)=>a.k-b.k||a.i-b.i).slice(0, 8).map(x=>x.r);
  if(!_kHits.length){ box.innerHTML = '<div class="muted">Tidak ditemukan.</div>'; return; }
  const stLabel = {'ready':'Ready','ready-indent':'Ready-Indent','indent':'Indent','':'Kosong'};
  box.innerHTML = _kHits.map((r,i)=>{
    const stok = r.plRows.reduce((a,x)=>a+(Number(x.available)||0),0);
    const price = recPrice(r);
    return `<div class="kHit"><div class="kHitName">${escHtml(r.deskripsi)} <span class="itemNo">(${escHtml(r.itemNo)})</span>
      <div class="kHitMeta">${price ? kasirRp(price) : 'Harga belum ada'} &middot; ${stLabel[recStatus(r)]}${stok ? ' &middot; stok '+stok : ''}${r.barcode ? ' &middot; BC '+escHtml(r.barcode) : ''}</div></div>
      <button class="small kHitAdd" data-i="${i}" type="button">+ Tambah</button></div>`;
  }).join('');
}
function bindKasir(){
  kasirRenderTabs(); kasirRenderBody(); kasirRenderHits();
  const inp = document.getElementById('kSearch');
  inp.oninput = ()=>{ _kQuery = inp.value; clearTimeout(_kTimer); _kTimer = setTimeout(kasirRenderHits, 200); };
  document.getElementById('kSearchRes').onclick = (e)=>{
    const b = e.target.closest && e.target.closest('.kHitAdd'); if(!b) return;
    const rec = _kHits[Number(b.dataset.i)];
    if(rec){
      kasirAddItem(rec);
      _kQuery = ''; inp.value = ''; kasirRenderHits(); inp.focus(); // kosongkan pencarian setelah item ditambahkan
    }
  };
}

function uploadView(){
  return `<div class="card">
    <div class="uploadBlock">
      <h3>1. Price List (Reborn), Serial Number & Stock Available</h3>
      <div class="hint">Pilih langsung 1-3 file sekaligus (boleh sebagian) \u2014 jenisnya dikenali otomatis. <b>Price List:</b> file Reborn_PriceList (kolom Item No., Retail). <b>Stock Available:</b> nama file mengandung "Stock Available" (stok gudang sendiri + cabang lain). <b>Serial Number:</b> file SN. Kalau ada file yang tidak dikenali, semua upload pada batch ini dibatalkan.</div>
      <input type="file" id="fileInputCombo" accept=".xlsx,.xls,.csv" multiple>
      <div id="msgCombo" class="muted"></div>
      <div id="comboSummary" class="muted" style="margin-top:8px;line-height:1.6;">${comboSummaryHtml()}</div>
    </div>
    <div class="uploadBlock">
      <h3>2. Barcode</h3>
      <div class="hint">Kolom: <b>Item No., Item Description, Bar Code</b>. Item tanpa barcode otomatis dilewati.</div>
      <input type="file" id="fileInputBarcode" accept=".xlsx,.xls,.csv">
      <div id="msgBarcode" class="muted">${state.barcodeUpdated ? 'Terakhir: '+state.barcodeUpdated+' ('+state.barcode.length+' baris)' : ''}</div>
    </div>
    <div class="uploadBlock">
      <h3>3. Manual Serial Number / ACC / Price List</h3>
      <div class="hint">Kolom: <b>Item Description, Barcode/Imei, Price, WhsCode</b>. Dipakai sebagai pendukung: melengkapi barcode yang belum ada di file Barcode, dan memberi harga referensi untuk item yang berstatus Indent di gudang sendiri. Baris gudang sendiri (SDNC.*) otomatis diabaikan.</div>
      <input type="file" id="fileInputManual" accept=".xlsx,.xls,.csv">
      <div id="msgManual" class="muted">${state.manualSupportUpdated ? 'Terakhir: '+state.manualSupportUpdated+' ('+state.manualSupport.length+' deskripsi unik)' : ''}</div>
    </div>
    <div class="uploadBlock">
      <h3>4. Skema Leasing (khusus staff)</h3>
      <div class="hint">File <b>SKEMA_LEASING_*.xlsx</b> (sheet REKAP). Isinya hanya bisa dilihat di tab <b>Skema Leasing</b> pada mode staff, tidak tampil di halaman umum / promotor.</div>
      <input type="file" id="fileInputSkema" accept=".xlsx,.xls">
      <div id="msgSkema" class="muted">${state.leasingUpdated ? 'Terakhir: '+state.leasingUpdated+' ('+state.leasingRows.length+' item)' : ''}</div>
    </div>
  </div>`;
}
// Baca & parsing Excel dilakukan di Web Worker terpisah supaya halaman tidak "macet"
// saat memproses file besar (puluhan ribu baris). Interface readExcel() tetap sama persis.
const _xlsxWorkerCode = `
  importScripts('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
  const OWN_WAREHOUSES = ["SDNC.UTM","SDNC.SHO","SDNC.DEM","SDNC.RUS","SDNX.STR"];
  function pick(r, keys){
    const norm = s => String(s).trim().toLowerCase().replace(/\\s+/g,' ');
    const wanted = keys.map(norm);
    for(const rawKey of Object.keys(r)){ if(wanted.includes(norm(rawKey))) return r[rawKey]; }
    return '';
  }
  function toNumber(v){
    if(typeof v === 'number') return v;
    if(!v) return 0;
    const n = parseFloat(String(v).replace(/[^0-9.-]/g,''));
    return isNaN(n) ? 0 : n;
  }
  function transform(kind, rows){
    if(kind === 'priceList'){
      // File Reborn_PriceList: harga diambil dari kolom Retail-AMT. Item tanpa harga dibuang.
      const out = [];
      rows.forEach(r=>{
        const itemNo = String(pick(r,['Item No.','Item No'])||'').trim();
        const harga = toNumber(pick(r,['Retail-AMT']));
        if(itemNo && harga > 0) out.push({itemNo, harga});
      });
      return out;
    }
    if(kind === 'serialNumber') return rows.map(r=>({
      itemCode: String(pick(r,['Item Code'])||'').trim(),
      deskripsi: String(pick(r,['Item Description'])||'').trim(),
      serial: String(pick(r,['Serial Number'])||'').trim(),
      tanggal: String(pick(r,['Admission Date'])||'').trim(),
      gudang: String(pick(r,['Warehouse Code'])||'').trim(),
      status: String(pick(r,['Status'])||'').trim()
    })).filter(r=>r.itemCode);
    if(kind === 'stockCabang'){
      // File Stock Available: digabung per item. Gudang sendiri -> own (available & allocated),
      // cabang lain -> other (hanya yang Available > 0).
      const ownSet = new Set(OWN_WAREHOUSES);
      const map = {}; const order = [];
      rows.forEach(r=>{
        const itemNo = String(pick(r,['Item No.','Item No'])||'').trim();
        const g = String(pick(r,['Warehouse Code'])||'').trim();
        if(!itemNo || !g) return;
        const av = toNumber(pick(r,['Available']));
        const al = toNumber(pick(r,['Allocated']));
        const isOwn = ownSet.has(g);
        if(!isOwn && av <= 0) return;
        let rec = map[itemNo];
        if(!rec){ rec = map[itemNo] = {itemNo, deskripsi: String(pick(r,['Item Description'])||'').trim()}; order.push(rec); }
        if(isOwn){ (rec.own = rec.own || []).push({g, a: av, al}); }
        else { (rec.other = rec.other || []).push({g, a: av}); }
      });
      return order;
    }
    if(kind === 'barcode') return rows.map(r=>({
      itemNo: String(pick(r,['Item No.','Item No'])||'').trim(),
      deskripsi: String(pick(r,['Item Description'])||'').trim(),
      barcode: String(pick(r,['Bar Code','Barcode'])||'').trim()
    })).filter(r=>r.itemNo && r.barcode);
    if(kind === 'manual'){
      function mode(arr){
        if(!arr.length) return '';
        const freq = {}; let best = arr[0], bestCount = 0;
        arr.forEach(v=>{ freq[v] = (freq[v]||0)+1; if(freq[v] > bestCount){ bestCount = freq[v]; best = v; } });
        return best;
      }
      const ownSet = new Set(OWN_WAREHOUSES);
      const groups = {};
      rows.forEach(r=>{
        const whs = String(pick(r,['WhsCode'])||'').trim();
        if(ownSet.has(whs)) return; // gudang sendiri diabaikan, sudah ada Price List resmi
        const deskripsi = String(pick(r,['Item Description'])||'').trim();
        if(!deskripsi) return;
        const key = deskripsi.toLowerCase();
        const bcImei = String(pick(r,['Barcode/Imei','Barcode','Imei'])||'').trim();
        const barcodePart = bcImei.split('-')[0].trim();
        const harga = toNumber(pick(r,['Price']));
        if(!groups[key]) groups[key] = { deskripsi, barcodes: [], prices: [], gudangSet: {} };
        if(barcodePart) groups[key].barcodes.push(barcodePart);
        if(harga) groups[key].prices.push(harga);
        if(whs) groups[key].gudangSet[whs] = true;
      });
      return Object.values(groups).map(g=>({
        deskripsi: g.deskripsi,
        barcode: mode(g.barcodes),
        harga: mode(g.prices),
        gudangList: Object.keys(g.gudangSet)
      }));
    }
    return rows;
  }
  function parseLeasing(aoa){
    let hi = -1;
    for(let i=0;i<Math.min(aoa.length,10);i++){
      if(aoa[i] && String(aoa[i][1]||'').trim().toUpperCase() === 'ITEM NAME'){ hi = i; break; }
    }
    if(hi < 0) return [];
    const FIRST = 7, YES = '\\u2714', NO = '\\u274C';
    const grp = aoa[hi-1] || [], head = aoa[hi];
    const note = String((grp[0]||'')).trim();
    const scheme = []; const cols = [];
    let curG = '';
    for(let c=FIRST;c<head.length;c++){
      const g = String(grp[c]||'').trim(); if(g) curG = g;
      const l = String(head[c]||'').trim();
      if(!l) continue;
      scheme.push({g: curG, l}); cols.push(c);
    }
    const out = [{t:'h', note, s: scheme}];
    for(let r=hi+1;r<aoa.length;r++){
      const row = aoa[r]; if(!row) continue;
      const b = String(row[0]||'').trim(), n = String(row[1]||'').trim();
      if(!b || !n || typeof row[0] === 'number') continue;
      const v = cols.map(c=>{
        const x = row[c];
        if(typeof x === 'number') return x;
        const sx = String(x==null?'':x);
        if(sx.indexOf(YES) >= 0) return 'Y';
        if(sx.indexOf(NO) >= 0) return 'N';
        return '';
      });
      out.push({t:'i', b, n, srp: toNumber(row[2]), cb: toNumber(row[3]), e: toNumber(row[4]), v});
    }
    return out;
  }
  function detectKind(headers, fileName){
    const name = String(fileName||'').toLowerCase();
    if(name.includes('stock available')) return 'stockCabang';
    const norm = s => String(s).trim().toLowerCase().replace(/\\s+/g,' ');
    const set = new Set(headers.map(norm));
    if(set.has('retail') && set.has('gro-1')) return 'priceList';
    if(set.has('list price')) return null; // format price list lama sudah tidak dipakai
    if(set.has('serial number') || set.has('admission date')) return 'serialNumber';
    if(set.has('warehouse code') && (set.has('item no.') || set.has('item no'))) return 'stockCabang';
    return null;
  }
  onmessage = function(e){
    try{
      const {kind, buffer, fileName} = e.data;
      const wb = XLSX.read(buffer, {type:'array'});
      if(kind === 'leasing'){
        const ws = wb.Sheets['REKAP'] || wb.Sheets[wb.SheetNames[0]];
        const aoa = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:''});
        postMessage({ok:true, kind, rows: parseLeasing(aoa), fileName});
        return;
      }
      const rawRows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {raw:true, defval:''});
      if(kind === 'auto'){
        const headers = rawRows.length ? Object.keys(rawRows[0]) : [];
        const detected = detectKind(headers, fileName);
        if(!detected){ postMessage({ok:false, reason:'unknown', fileName}); return; }
        postMessage({ok:true, kind: detected, rows: transform(detected, rawRows), fileName});
      } else {
        postMessage({ok:true, kind, rows: transform(kind, rawRows), fileName});
      }
    }catch(err){ postMessage({ok:false, reason:'error', fileName: e.data && e.data.fileName}); }
  };
`;
const _xlsxWorkerUrl = URL.createObjectURL(new Blob([_xlsxWorkerCode], {type:'application/javascript'}));

// readExcel sekarang mengembalikan data yang SUDAH dalam bentuk final (siap dipakai state.items dst),
// karena pick/toNumber/filter gudang sendiri juga dikerjakan di dalam worker.
function readExcel(file, kind, onRows){
  const worker = new Worker(_xlsxWorkerUrl);
  const reader = new FileReader();
  reader.onload = (ev)=>{ worker.postMessage({kind, buffer: ev.target.result}, [ev.target.result]); };
  reader.onerror = ()=>{ onRows(null); worker.terminate(); };
  worker.onmessage = (e)=>{ onRows(e.data.ok ? e.data.rows : null); worker.terminate(); };
  worker.onerror = ()=>{ onRows(null); worker.terminate(); };
  reader.readAsArrayBuffer(file);
}
// Untuk upload gabungan: jenis file (priceList/serialNumber/stockCabang) dikenali otomatis dari kolomnya.
// onResult menerima objek lengkap: {ok, kind, rows, fileName, reason}
function readExcelDetect(file, onResult){
  const worker = new Worker(_xlsxWorkerUrl);
  const reader = new FileReader();
  reader.onload = (ev)=>{ worker.postMessage({kind:'auto', buffer: ev.target.result, fileName: file.name}, [ev.target.result]); };
  reader.onerror = ()=>{ onResult({ok:false, reason:'read', fileName:file.name}); worker.terminate(); };
  worker.onmessage = (e)=>{ onResult(e.data); worker.terminate(); };
  worker.onerror = ()=>{ onResult({ok:false, reason:'error', fileName:file.name}); worker.terminate(); };
  reader.readAsArrayBuffer(file);
}
function pick(r, ...keys){
  const norm = s => String(s).trim().toLowerCase().replace(/\s+/g,' ');
  const wanted = keys.map(norm);
  for(const rawKey of Object.keys(r)){ if(wanted.includes(norm(rawKey))) return r[rawKey]; }
  return '';
}
function toNumber(v){
  if(typeof v === 'number') return v;
  if(!v) return 0;
  const n = parseFloat(String(v).replace(/[^0-9.-]/g,''));
  return isNaN(n) ? 0 : n;
}
function bindUpload(){
  document.getElementById('fileInputCombo').onchange = (e)=>{
    const files = Array.from(e.target.files || []); if(!files.length) return;
    const msg = document.getElementById('msgCombo');
    msg.style.color = 'var(--muted)';
    msg.textContent = `Membaca & mengenali jenis ${files.length} file...`;
    Promise.all(files.map(f=> new Promise(resolve=> readExcelDetect(f, resolve))))
      .then(async (results)=>{
        const failed = results.filter(r=>!r.ok);
        if(failed.length){
          msg.style.color = '#e07a7a';
          msg.textContent = `Dibatalkan: ${failed.length} file tidak dikenali jenisnya (${failed.map(f=>f.fileName).join(', ')}). Tidak ada yang diupload, cek lagi kolom di file tersebut.`;
          return;
        }
        const kinds = results.map(r=>r.kind);
        const dupe = kinds.find((k,i)=>kinds.indexOf(k)!==i);
        if(dupe){
          msg.style.color = '#e07a7a';
          msg.textContent = `Dibatalkan: ada lebih dari 1 file dengan jenis yang sama (${dupe}). Pilih file sekali untuk tiap jenis.`;
          return;
        }
        // semua file valid & jenisnya unik -> upload satu per satu
        const labels = {priceList:'Price List', serialNumber:'Serial Number', stockCabang:'Stock Available'};
        for(const r of results){
          msg.style.color = 'var(--muted)';
          msg.textContent = `Mengunggah ${labels[r.kind]} (${r.rows.length} baris)...`;
          const progressCb = (done,total)=>{ msg.textContent = `Mengunggah ${labels[r.kind]}... bagian ${done}/${total}`; };
          if(r.kind === 'priceList'){
            const updatedAt = await pushToFirestore('priceList', r.rows, 'priceList', progressCb);
            state.items = r.rows; state.itemsUpdated = fmtDate(updatedAt);
          } else if(r.kind === 'serialNumber'){
            const updatedAt = await pushToFirestore('serialNumber', r.rows, 'serialNumber', progressCb);
            state.serialNumber = r.rows; state.serialUpdated = fmtDate(updatedAt);
          } else if(r.kind === 'stockCabang'){
            const updatedAt = await pushToFirestore('stockCabang', r.rows, 'stockCabang', progressCb, 1500);
            state.stockCabang = r.rows; state.cabangUpdated = fmtDate(updatedAt);
          }
        }
        buildIndices();
        msg.style.color = 'var(--ok)';
        msg.textContent = `Selesai! ${results.length} file berhasil diupload: ${results.map(r=>labels[r.kind]).join(', ')}.`;
        const summaryEl = document.getElementById('comboSummary');
        if(summaryEl) summaryEl.innerHTML = comboSummaryHtml();
      });
  };
  document.getElementById('fileInputBarcode').onchange = (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const msg = document.getElementById('msgBarcode'); msg.textContent = 'Memproses file...';
    readExcel(file, 'barcode', async (parsed)=>{
      if(!parsed){ msg.textContent = 'Gagal membaca file.'; return; }
      msg.textContent = `Mengunggah ${parsed.length} baris ke database bersama...`;
      const updatedAt = await pushToFirestore('barcode', parsed, 'barcode');
      state.barcode = parsed; state.barcodeUpdated = fmtDate(updatedAt);
      buildIndices();
      msg.textContent = `Terakhir: ${state.barcodeUpdated} (${state.barcode.length} baris)`;
    });
  };
  document.getElementById('fileInputManual').onchange = (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const msg = document.getElementById('msgManual'); msg.textContent = 'Memproses file... (file besar, mohon tunggu)';
    readExcel(file, 'manual', async (parsed)=>{
      if(!parsed){ msg.textContent = 'Gagal membaca file.'; return; }
      msg.textContent = `Mengunggah ${parsed.length} deskripsi unik ke database bersama...`;
      const updatedAt = await pushToFirestore('manualSupport', parsed, 'manualSupport', (done,total)=>{
        msg.textContent = `Mengunggah... bagian ${done}/${total}`;
      });
      state.manualSupport = parsed; state.manualSupportUpdated = fmtDate(updatedAt);
      buildIndices();
      msg.textContent = `Terakhir: ${state.manualSupportUpdated} (${state.manualSupport.length} deskripsi unik)`;
    });
  };
  document.getElementById('fileInputSkema').onchange = (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const msg = document.getElementById('msgSkema');
    msg.style.color = 'var(--muted)'; msg.textContent = 'Memproses file...';
    readExcel(file, 'leasing', async (parsed)=>{
      if(!parsed || parsed.length < 2){
        msg.style.color = '#e07a7a';
        msg.textContent = 'Gagal: file tidak dikenali sebagai Skema Leasing (butuh sheet REKAP dengan kolom ITEM NAME). Tidak ada yang diupload.';
        return;
      }
      try{
        msg.textContent = `Mengunggah skema ${parsed.length-1} item...`;
        const updatedAt = await pushToFirestore('leasingScheme', parsed, 'leasingScheme', (done,total)=>{
          msg.textContent = `Mengunggah... bagian ${done}/${total}`;
        }, 400);
        applyLeasing(parsed, updatedAt);
        msg.style.color = 'var(--ok)';
        msg.textContent = `Terakhir: ${state.leasingUpdated} (${state.leasingRows.length} item)`;
      }catch(err){
        msg.style.color = '#e07a7a';
        msg.textContent = 'Gagal mengunggah: ' + (err && err.message ? err.message : err);
      }
    });
  };
}

loadAll();
